{% load static %} <!-- Habilita o carregamento de arquivos estáticos do Django -->

<!DOCTYPE html>
<html lang="pt-BR"> <!-- Define o idioma da página como português do Brasil -->

<head>
    <meta charset="UTF-8"> <!-- Permite exibir acentos e caracteres especiais -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adapta o layout à largura da tela, inclusive em celulares -->

    <title>{{ tag_title|default:'ProjectUs' }}</title>
    <!-- Usa o título enviado pelo Django ou ProjectUs como padrão -->

    <!-- Carrega o Bootstrap 5.3.3 pela CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Carrega o CSS personalizado do ProjectUs -->
    <link rel="stylesheet" href="{% static 'projectus/style.css' %}">

    <!-- Permite adicionar CSS específico nas páginas filhas -->
    {% block extra_css %}{% endblock %}
</head>

<body>

    <div id="container"> <!-- Agrupa a estrutura principal do site -->

        <header class="site-header"> <!-- Cabeçalho principal -->



            <a class="site-logo" href="{% url 'home' %}"> <!-- Link para a página inicial -->

                <img src="{% static 'projectus/logo_projectus.png' %}" alt="Logo ProjectUs" class="logo-img">
                <!-- Carrega o símbolo da logo -->

                <span></span> <!-- Exibe o nome ao lado do símbolo -->

            </a>



            <nav class="site-nav"> <!-- Barra de navegação principal -->

                <a href="{% url 'home' %}">Início</a>
                <!-- Link para a página inicial -->

                {% if user.is_authenticated %}
                <!-- Verifica se existe um usuário autenticado -->

                <a href="{% url 'profile' %}" title="Ver/editar perfil de {{ user.username }}">
                    Olá, {{ user.username }}
                </a>
                <!-- Exibe o nome do usuário e permite abrir o perfil -->

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <!-- Protege o formulário contra requisições CSRF -->

                    <button type="submit">Sair</button>
                    <!-- Envia uma requisição POST para encerrar a sessão -->
                </form>

                {% else %}
                <!-- Exibe esta opção se o usuário não estiver autenticado -->

                <a href="{% url 'login' %}">Entrar</a>
                <!-- Link para a página de login -->

                {% endif %}
                <!-- Finaliza a condição de autenticação -->

            </nav> <!-- Finaliza a navegação -->

        </header> <!-- Finaliza o cabeçalho -->

        <main>
            {% block content %}{% endblock %}
            <!-- Área onde cada página filha coloca seu próprio conteúdo -->
        </main>

        <footer>
            <div>&copy; 2026 {{ site_name }}</div>
            <!-- Exibe o ano e o nome do site -->
        </footer>

    </div> <!-- Finaliza o contêiner principal -->

    <!-- Permite adicionar JavaScript específico nas páginas filhas -->
    {% block extra_js %}{% endblock %}

</body>

</html>
